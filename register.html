<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="keywords" content="books, online bookstore, buy books, Volga, register">
        <meta name="description" content="Register for an account at Volga, your online bookstore.">
        <title>Volga About</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="Images/tempIcon.png" type="image/png">
    </head>
    <body>
        <header>
            <div class="header-top">
            <h1 class="volga-text">Volga</h1>
                <img src="Images/tempIcon.png" alt="Volga Logo" class="logo">
                <form action="search.html" method="get" class="search">
                    <input type="text" class="search-bar" name="query" placeholder="Search books..." required>
                    <button type="submit" class="search-submit">Search</button>
                </form>
                <a href="cart.html"><img src="Images/shoppingCart.png" alt="Shopping Cart" class="cart-icon"></a>
                <a href="profile.html"><img src="Images/defaultProfile.png" alt="User Profile" class="profile-icon"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li>Genres<ul>
                        <li><a href="fiction.html">Fiction</a></li>
                        <li><a href="nonfiction.html">Non-Fiction</a></li>
                        <li><a href="horror.html">Horror</a></li>
                        <li><a href="mystery.html">Mystery</a></li>
                        <li><a href="sci-fi.html">Sci-Fi</a></li>
                        <li><a href="fantasy.html">Fantasy</a></li>
                        <li><a href="romance.html">Romance</a></li>
                        <li><a href="thriller.html">Thriller</a></li>
                        <li><a href="children.html">Children's</a></li>
                    </ul></li>
                    <li><a href="ourfavs.html">Our Favorites</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="register-section">
                <h2>Create an Account</h2>
                <form id="regForm" action="javascript:void(0)" method="post" class="register-form">
                    <label for="first-name">First name:</label>
                    <input type="text" id="first-name" name="first-name" class="notEmpty" required>
                    <span class="invalid" id="invalidFirstName"></span>

                    <label for="last-name">Last name:</label>
                    <input type="text" id="last-name" name="last-name" class="notEmpty" required>
                    <span class="invalid" id="invalidLastName"></span>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="notEmpty" required>
                    <span class="invalid" id="invalidEmail"></span>

                    <button type="submit" class="register-button">Register</button>
                    <button type="reset" id="clear" class="register-button">Clear</button>
                </form>
            </section>
        </main>
        <footer>
            <p>&copy; 2025 Volga. All rights reserved.</p>
        </footer>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
            crossorigin="anonymous"></script>
        <script src="scripts/form.js"></script>
        <script src="scripts/help.js"></script>
    </body>
</html>
